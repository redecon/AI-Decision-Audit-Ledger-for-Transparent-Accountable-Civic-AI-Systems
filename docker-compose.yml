version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: civic-ledger-db
    environment:
      POSTGRES_DB: civic_ledger
      POSTGRES_USER: ledger_user
      POSTGRES_PASSWORD: ledger_pass
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
